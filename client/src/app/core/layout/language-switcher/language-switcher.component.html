<div class="language-selector">
    <mat-form-field>
      <mat-label>{{ 'GENERAL.LANGUAGE' | translate }}</mat-label>
      <mat-select [value]="currentLang" (selectionChange)="onLanguageChange($event.value)">
        @for (lang of languages; track lang) {
        <mat-option [value]="lang">
          {{ lang | translate }}
        </mat-option>
        }
      </mat-select>
    </mat-form-field>
  </div>
