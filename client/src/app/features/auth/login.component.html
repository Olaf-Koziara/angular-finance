<section class="auth-container" data-testid="login">
  <div class="auth-card">
    <div class="auth-header">
      <h1>Welcome Back</h1>
      <p class="auth-subtitle">Sign in to your account to continue</p>
    </div>

    <form [formGroup]="form" (ngSubmit)="submit()">
      <div class="form-field">
        <label for="email">Email Address</label>
        <input
          id="email"
          type="email"
          formControlName="email"
          autocomplete="username"
          placeholder="Enter your email"
          [attr.aria-invalid]="emailInvalid()"
          [class.invalid]="emailInvalid()"
        />
        @if (emailInvalid()) {
          <small class="error-message">Please enter a valid email address</small>
        }
      </div>

      <div class="form-field">
        <label for="password">Password</label>
        <div class="password-input-wrapper">
          <input
            id="password"
            [type]="showPassword() ? 'text' : 'password'"
            formControlName="password"
            autocomplete="current-password"
            placeholder="Enter your password"
            [attr.aria-invalid]="passwordInvalid()"
            [class.invalid]="passwordInvalid()"
          />
          <button
            type="button"
            class="password-toggle"
            (click)="togglePasswordVisibility()"
            [attr.aria-label]="showPassword() ? 'Hide password' : 'Show password'"
          >
            {{ showPassword() ? '👁️' : '👁️‍🗨️' }}
          </button>
        </div>
        @if (passwordInvalid()) {
          <small class="error-message">Password must be at least 8 characters</small>
        }
      </div>

      @if (error()) {
        <div class="alert alert-error" role="alert">
          {{ error() }}
        </div>
      }

      <button type="submit" class="btn-primary" [disabled]="submitDisabled()">
        @if (loading()) {
          <span class="spinner"></span>
          <span>Signing in...</span>
        } @else {
          <span>Sign in</span>
        }
      </button>
    </form>

    <div class="auth-footer">
      <p>Don't have an account? <a routerLink="/register" class="link">Sign up</a></p>
    </div>
  </div>
</section>
