<section class="auth-container" data-testid="login">
  <h1>Sign in</h1>

  <form [formGroup]="form" (ngSubmit)="submit()">
    <label class="form-field">
      <span>Email</span>
      <input
        type="email"
        formControlName="email"
        autocomplete="username"
        [attr.aria-invalid]="emailInvalid()"
      />
      <small *ngIf="emailInvalid()">Enter a valid email</small>
    </label>

    <label class="form-field">
      <mat-label>Password</mat-label>
      <input
        type="password"
        formControlName="password"
        autocomplete="current-password"
        [attr.aria-invalid]="passwordInvalid()"
      />
      <small *ngIf="passwordInvalid()">Password is required</small>
    </label>

    <button matButton="elevated" type="submit" [disabled]="submitDisabled()">
      {{ loading() ? 'logging in?' : 'Login' }}
    </button>
  </form>
  <a matButton="elevated" [routerLink]="['/register']">Register</a>

  <p class="error" *ngIf="error()">{{ error() }}</p>
</section>
