<section class="page">
  <!-- <header class="page-header">
    <div>
      <h1>Transactions</h1>
    </div>
  </header> -->
  <div class="content">
    <mat-card class="form-card mat-elevation-z4 transaction-form-card">
      <mat-card-header>
        <mat-card-title>
          {{
            editingTransaction()
              ? ('TRANSACTIONS.EDIT_TRANSACTION' | translate)
              : ('TRANSACTIONS.NEW' | translate)
          }}
        </mat-card-title>
        @if (editingTransaction()) {
        <mat-card-subtitle>{{ editingTransaction()?.title }}</mat-card-subtitle>
        }
      </mat-card-header>
      <mat-card-content>
        <app-transaction-form
          [transaction]="editingTransaction()"
          (submitted)="createTransaction($event)"
          (updated)="updateTransaction($event)"
          (cancelled)="cancelEditing()"
        ></app-transaction-form>
      </mat-card-content>
    </mat-card>
    <mat-card class="list-card mat-elevation-z4">
      <mat-card-header>
        <mat-card-title>{{ 'TRANSACTIONS.HISTORY' | translate }}</mat-card-title>
      </mat-card-header>
      <mat-card-content>
        <div class="filters-actions-container">
          <app-transaction-filters [filters]="filters()" (changed)="handleFilterChange($event)" class="filters-component"></app-transaction-filters>

          <div class="selection-actions">
            @if (!selectionMode()) {
              <button mat-stroked-button color="primary" (click)="toggleSelectionMode()">
                <mat-icon>check_box</mat-icon>
                {{ 'TRANSACTIONS.SELECT' | translate }}
              </button>
            } @else {
              @if (selectedIds().size > 0) {
                <button mat-flat-button color="warn" (click)="removeSelected()">
                  <mat-icon>delete</mat-icon>
                  {{ 'TRANSACTIONS.DELETE_SELECTED' | translate: { count: selectedIds().size } }}
                </button>
              }
              <button mat-stroked-button (click)="toggleSelectionMode()">
                {{ 'TRANSACTIONS.CANCEL_SELECTION' | translate }}
              </button>
            }
          </div>
        </div>

        <app-transaction-list
          [transactions]="transactions()"
          [total]="total()"
          [loading]="loading()"
          [sort]="sort()"
          [selectionMode]="selectionMode()"
          [selectedIds]="selectedIds()"
          (removed)="removeTransaction($event)"
          (sortChanged)="handleSortChange($event)"
          (edited)="startEditing($event)"
          (toggleSelection)="onToggleSelection($event)"
          (toggleAll)="onToggleAll($event)"
        ></app-transaction-list>
      </mat-card-content>
      <app-transaction-pagination [length]="total()" [pageSize]="pagination().pageSize" [pageIndex]="pagination().pageIndex"
      [pageSizeOptions]="pageSizeOptions" (pageChange)="handlePageChange($event)"></app-transaction-pagination>
    </mat-card>
  </div>
</section>
