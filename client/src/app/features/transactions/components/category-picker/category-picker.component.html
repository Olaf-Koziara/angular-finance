<div class="category-picker">
  <mat-form-field appearance="outline">
    <mat-label>{{ 'TRANSACTIONS.CATEGORY' | translate }}</mat-label>
    <mat-select
      [value]="selectedCategory()"
      (valueChange)="onCategoryChange($event)"
    >
      @for (category of categories(); track category) {
        <mat-option [value]="category">{{
          `TRANSACTIONS.CATEGORIES.${category.toUpperCase()}` | translate
        }}</mat-option>
      }
    </mat-select>
    @if (hasError()) {
      <mat-error>{{ errorMessage() }}</mat-error>
    }
  </mat-form-field>
  <button
    mat-icon-button
    type="button"
    class="ai-suggest-button"
    [disabled]="!title() || isLoadingSuggestion()"
    (click)="getSuggestion()"
    [attr.aria-label]="'TRANSACTIONS.AI_SUGGEST_CATEGORY' | translate"
  >
    @if (isLoadingSuggestion()) {
      <mat-spinner diameter="24"></mat-spinner>
    } @else {
      <mat-icon>auto_awesome</mat-icon>
    }
  </button>
</div>
