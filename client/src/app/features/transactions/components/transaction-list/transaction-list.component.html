<ng-container *ngIf="hasTransactions(); else empty">
  <table mat-table [dataSource]="transactions()" class="transaction-table mat-elevation-z2">
    <ng-container matColumnDef="date">
      <th mat-header-cell *matHeaderCellDef>Date</th>
      <td mat-cell *matCellDef="let item">{{ item.date | date: 'mediumDate' }}</td>
    </ng-container>

    <ng-container matColumnDef="category">
      <th mat-header-cell *matHeaderCellDef>Category</th>
      <td mat-cell *matCellDef="let item">{{ item.category }}</td>
    </ng-container>

    <ng-container matColumnDef="type">
      <th mat-header-cell *matHeaderCellDef>Type</th>
      <td mat-cell *matCellDef="let item">
        <mat-chip [color]="item.type === 'income' ? 'primary' : 'warn'" selected>{{ item.type | titlecase }}</mat-chip>
      </td>
    </ng-container>

    <ng-container matColumnDef="amount">
      <th mat-header-cell *matHeaderCellDef>Amount</th>
      <td mat-cell *matCellDef="let item">{{ item.amount | currency }}</td>
    </ng-container>

    <ng-container matColumnDef="actions">
      <th mat-header-cell *matHeaderCellDef></th>
      <td mat-cell *matCellDef="let item">
        <button mat-icon-button type="button" color="warn" (click)="remove(item.id)" aria-label="Remove">
          <mat-icon>delete</mat-icon>
        </button>
      </td>
    </ng-container>

    <thead>
      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    </thead>
    <tbody>
      <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
    </tbody>
  </table>
</ng-container>

<ng-template #empty>
  <div class="empty-state">
    <mat-icon>account_balance_wallet</mat-icon>
    <p>No transactions yet</p>
  </div>
</ng-template>
