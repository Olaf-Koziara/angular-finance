<form class="transaction-form" [formGroup]="form" (ngSubmit)="submit()">
  <mat-form-field appearance="outline">
    <mat-label>Amount</mat-label>
    <input matInput type="number" formControlName="amount" min="0" step="0.01" />
    <mat-error *ngIf="form.controls.amount.hasError('required')">Amount is required</mat-error>
    <mat-error *ngIf="form.controls.amount.hasError('min')">Amount must be positive</mat-error>
  </mat-form-field>

  <mat-form-field appearance="outline">
    <mat-label>Category</mat-label>
    <input matInput formControlName="category" placeholder="Groceries" />
    <mat-error *ngIf="form.controls.category.hasError('required')">Category is required</mat-error>
  </mat-form-field>

  <mat-form-field appearance="outline">
    <mat-label>Date</mat-label>
    <input matInput [matDatepicker]="picker" formControlName="date" />
    <mat-datepicker-toggle matSuffix [for]="picker"></mat-datepicker-toggle>
    <mat-datepicker #picker></mat-datepicker>
    <mat-error *ngIf="form.controls.date.hasError('required')">Date is required</mat-error>
  </mat-form-field>

  <mat-form-field appearance="outline">
    <mat-label>Type</mat-label>
    <mat-select formControlName="type">
      <mat-option value="income">Income</mat-option>
      <mat-option value="expense">Expense</mat-option>
    </mat-select>
    <mat-error *ngIf="form.controls.type.hasError('required')">Type is required</mat-error>
  </mat-form-field>

  <div class="actions">
    <button mat-flat-button color="primary" type="submit">Add transaction</button>
  </div>
</form>
